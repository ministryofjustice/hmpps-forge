version: 2

updates:
  - package-ecosystem: npm
    directory: /packages
    schedule:
      interval: daily
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: npm
    directory: /examples-app
    schedule:
      interval: daily
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
